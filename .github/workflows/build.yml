name: Debian XRDP build

on:
  schedule:
    - cron: "0 3 * * 6"
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "config/**"
      - ".github/workflows/build.yml"
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest-fast
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Set registry and token
        shell: bash
        run: |
          if [[ "${{ github.server_url }}" == "https://github.com" ]]; then
            echo "REGISTRY=ghcr.io" >> "$GITHUB_ENV"
            echo "CONTAINER_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"
          else
            registry="${{ github.server_url }}"
            echo "REGISTRY=${registry#https://}" >> "$GITHUB_ENV"
            echo "CONTAINER_TOKEN=${{ secrets.FORGEJOTOKEN }}" >> "$GITHUB_ENV"
          fi

      - name: Set image name
        shell: bash
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.CONTAINER_TOKEN }}

      - name: Generate build version and Docker tags
        shell: bash
        run: |
          build_date="$(date -u +'%Y%m%d')"
          short_sha="$(git rev-parse --short HEAD)"
          build_version="${build_date}-${short_sha}"
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$build_version" >> "$GITHUB_ENV"

          for desktop in xfce mate; do
            suffix="-$desktop"
            echo "DOCKER_TAGS_${desktop^^}<<EOF" >> "$GITHUB_ENV"

            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              version="${GITHUB_REF#refs/tags/v}"
              echo "$image:$version${suffix}" >> "$GITHUB_ENV"
              echo "$image:debian13${suffix}" >> "$GITHUB_ENV"
              echo "$image:latest${suffix}" >> "$GITHUB_ENV"
            else
              branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
              clean_branch="$(sed 's/[^a-zA-Z0-9._-]/-/g' <<< "$branch")"

              if [[ "$branch" == "main" ]]; then
                echo "$image:debian13${suffix}" >> "$GITHUB_ENV"
                echo "$image:latest${suffix}" >> "$GITHUB_ENV"
                echo "$image:$build_version${suffix}" >> "$GITHUB_ENV"
                echo "$image:$build_date${suffix}" >> "$GITHUB_ENV"
              else
                echo "$image:dev-$clean_branch-$build_version${suffix}" >> "$GITHUB_ENV"
                echo "$image:dev-$clean_branch-latest${suffix}" >> "$GITHUB_ENV"
                echo "$image:dev-latest${suffix}" >> "$GITHUB_ENV"
              fi
            fi

            echo "EOF" >> "$GITHUB_ENV"
          done

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push XFCE image
        id: build_xfce
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.DOCKER_TAGS_XFCE }}
          build-args: |
            DESKTOP=xfce
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ env.BUILD_VERSION }}

      - name: Release XFCE build cache
        if: steps.build_xfce.outcome == 'success'
        shell: bash
        run: docker buildx prune --builder "${{ steps.buildx.outputs.name }}" --all --force

      - name: Build and push MATE image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.DOCKER_TAGS_MATE }}
          build-args: |
            DESKTOP=mate
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ env.BUILD_VERSION }}
